title: "JRO Brain Map"
description: "Jose Rodriguez Odon's personal knowledge base — paid ads, AI agents, influencer marketing, and more."
baseurl: "/cev-knowledge-bank"
url: "https://jrodriguezodon1.github.io"

author:
  name: Jose Rodriguez Odon
  initials: JRO

# Single flat collection — all entries live in _entries/
collections:
  entries:
    output: true
    permalink: /entry/:name/

# Default layout for all entries
defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: entry
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default

# No gem-based theme — full custom CSS
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - _scripts
  - paid-ads
  - influencer-marketing
  - dev-engineering
  - dev-technical
  - product-gtm
  - ai-agents
  - founder-business
  - life-personal
  - attribution-mmm
  - business-strategy
  - content-marketing

include:
  - _pages

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
